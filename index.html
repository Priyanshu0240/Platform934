<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9 ¾ | Magical Communications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --deep-obsidian: #08070b; --muted-gold: #a3854b; }
        body { font-family: 'Crimson Pro', serif; background-color: var(--deep-obsidian); color: #d1d5db; overflow: hidden; height: 100vh; }
        h1, h2, .heading-font { font-family: 'Cinzel', serif; letter-spacing: 0.2em; }
        .glass-panel { background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(30px); border: 1px solid rgba(163, 133, 75, 0.1); }
        .translucent-bar { background: rgba(10, 10, 15, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .platform-seal { width: 80px; height: 80px; border: 1px solid var(--muted-gold); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.8; }
        
        /* Video Containers */
        .video-box { position: relative; width: 100%; height: 100%; border-radius: 2rem; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        /* Draggable Artifacts */
        .artifact {
            position: absolute;
            cursor: grab;
            user-select: none;
            z-index: 50;
            transition: outline 0.2s;
            touch-action: none;
        }
        .artifact:active { cursor: grabbing; outline: 1px dashed var(--muted-gold); }
        .artifact img { width: 100%; height: 100%; pointer-events: none; }

        #companion-focus-box:fullscreen { background: black; display: flex; align-items: center; justify-content: center; }
        #companion-focus-box:fullscreen video { width: 100vw; height: 100vh; border-radius: 0; }
        .immersive-active .hide-on-immersive { opacity: 0; pointer-events: none; }
        .role-btn.active { border-color: var(--muted-gold); color: white; background: rgba(163, 133, 75, 0.1); }
        
        /* Custom Scrollbar for Enchantment Menu */
        .enchantment-scroll::-webkit-scrollbar { width: 4px; }
        .enchantment-scroll::-webkit-scrollbar-thumb { background: var(--muted-gold); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <div id="landing-page" class="h-full flex flex-col items-center justify-center p-6 relative">
        <div class="platform-seal mb-10">
            <span class="text-2xl font-light text-amber-100/90 leading-none">9</span>
            <div class="w-8 h-[0.5px] bg-amber-800/40 my-1"></div>
            <span class="text-sm font-light text-amber-100/90 leading-none">¾</span>
        </div>

        <div class="glass-panel p-10 rounded-[2.5rem] w-full max-w-sm shadow-2xl">
            <h2 class="text-center text-[10px] font-semibold mb-8 text-amber-900/80 uppercase tracking-[0.4em]">Establish Platform</h2>
            <div class="space-y-6">
                <div class="flex gap-2 mb-4">
                    <button id="btn-wizard" onclick="setRole('Wizard')" class="role-btn flex-1 py-3 border border-white/5 rounded-xl text-[10px] uppercase tracking-widest active transition">Wizard</button>
                    <button id="btn-witch" onclick="setRole('Witch')" class="role-btn flex-1 py-3 border border-white/5 rounded-xl text-[10px] uppercase tracking-widest transition">Witch</button>
                </div>
                <input type="text" id="platform-key" placeholder="Enter Marauder's Key" class="w-full bg-black/40 border border-amber-900/10 rounded-xl px-4 py-4 text-center focus:outline-none focus:border-amber-700/30 transition-all text-zinc-300 italic text-sm">
                <button onclick="apparate()" class="w-full bg-zinc-200 text-black font-semibold py-4 rounded-xl hover:bg-white transition active:scale-95 text-[10px] uppercase tracking-widest">Apparate</button>
            </div>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="portal-interface" class="hidden h-screen flex flex-col md:flex-row p-6 gap-6">
        <div class="flex-1 relative flex flex-col gap-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                <!-- Self View -->
                <div id="local-video-container" class="video-box glass-panel">
                    <video id="local-video" class="scale-x-[-1]" autoplay muted></video>
                    <div class="absolute bottom-6 left-6 flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-lg text-[10px] uppercase tracking-widest text-zinc-500 pointer-events-none">
                        Mirror of Erised (<span class="user-role-label">Wizard</span>)
                    </div>
                </div>

                <!-- Companion View -->
                <div id="companion-focus-box" class="video-box glass-panel group">
                    <video id="remote-video" autoplay></video>
                    <div class="absolute bottom-6 left-6 hide-on-immersive flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-lg text-[10px] uppercase tracking-widest text-zinc-500">
                        Companion <span class="user-role-label">Wizard</span>
                    </div>
                    <button onclick="enterFocus()" class="absolute top-6 right-6 p-3 glass-panel hover:bg-white/5 rounded-2xl opacity-0 group-hover:opacity-100 transition-all hide-on-immersive text-amber-100/50">
                        <i data-lucide="expand" size="20"></i>
                    </button>
                    <!-- Fullscreen Controls -->
                    <div id="focus-bar" class="hidden absolute bottom-10 left-1/2 -translate-x-1/2 translucent-bar px-8 py-4 rounded-[2rem] flex items-center gap-8 hide-on-immersive">
                        <button onclick="toggleAudio()" class="text-zinc-500 hover:text-white"><i data-lucide="mic"></i></button>
                        <button onclick="toggleVideo()" class="text-zinc-500 hover:text-white"><i data-lucide="video"></i></button>
                        <button onclick="exitFocus()" class="text-zinc-500 hover:text-red-400"><i data-lucide="shrink"></i></button>
                    </div>
                    <button id="immersive-toggle" onclick="toggleImmersive()" class="hidden absolute top-6 left-1/2 -translate-x-1/2 translucent-bar px-4 py-2 rounded-full text-[10px] uppercase tracking-widest text-zinc-500 hover:text-white transition">Toggle Controls</button>
                </div>
            </div>

            <!-- DASHBOARD NAV -->
            <div id="bottom-nav" class="glass-panel w-fit mx-auto px-10 py-5 rounded-[2rem] flex items-center gap-10 shadow-2xl">
                <button class="text-zinc-500 hover:text-white transition" title="Mute"><i data-lucide="mic"></i></button>
                <button class="text-zinc-500 hover:text-white transition" title="Stop Video"><i data-lucide="video"></i></button>
                <button class="text-zinc-500 hover:text-white transition" title="Marauder's Map"><i data-lucide="map"></i></button>
                
                <!-- Artifacts Menu -->
                <div class="relative group">
                    <button class="text-zinc-500 hover:text-amber-400 transition" title="Summon Artifacts">
                        <i data-lucide="sparkles"></i>
                    </button>
                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-4 hidden group-hover:flex flex-col glass-panel p-2 rounded-2xl w-48 gap-1 border border-white/10 shadow-2xl">
                        <div class="text-[9px] uppercase tracking-widest text-zinc-600 px-3 py-1">Summon Artifact</div>
                        <div class="max-h-60 overflow-y-auto enchantment-scroll">
                            <button onclick="summon('https://img.icons8.com/color/480/sorting-hat.png', 150)" class="w-full text-[10px] uppercase tracking-widest p-3 hover:bg-white/5 rounded-xl transition text-left flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-amber-500"></span> Sorting Hat
                            </button>
                            <button onclick="summon('https://i.ibb.co/6ZzXp7C/glasses.png', 120)" class="w-full text-[10px] uppercase tracking-widest p-3 hover:bg-white/5 rounded-xl transition text-left flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-zinc-400"></span> Potter's Specs
                            </button>
                            <button onclick="summon('https://i.ibb.co/3YxY6k4/beard.png', 180)" class="w-full text-[10px] uppercase tracking-widest p-3 hover:bg-white/5 rounded-xl transition text-left flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-white"></span> Albus' Beard
                            </button>
                            <button onclick="summon('https://i.ibb.co/Hn6S9Dk/luna.png', 140)" class="w-full text-[10px] uppercase tracking-widest p-3 hover:bg-white/5 rounded-xl transition text-left flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-pink-500"></span> Luna's Specs
                            </button>
                            <button onclick="summon('https://i.ibb.co/jR0Hn6S/snitch.png', 60)" class="w-full text-[10px] uppercase tracking-widest p-3 hover:bg-white/5 rounded-xl transition text-left flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-yellow-400"></span> Golden Snitch
                            </button>
                            <button onclick="summon('https://i.ibb.co/vYm6X9X/death-mask.png', 130)" class="w-full text-[10px] uppercase tracking-widest p-3 hover:bg-white/5 rounded-xl transition text-left flex items-center gap-2 text-red-300">
                                <span class="w-2 h-2 rounded-full bg-red-900"></span> Death Mask
                            </button>
                        </div>
                        <button onclick="clearArtifacts()" class="text-[10px] uppercase tracking-widest p-3 hover:bg-red-900/20 rounded-xl transition text-red-500 mt-2 border-t border-white/5">Finite Incantatem</button>
                    </div>
                </div>

                <div class="w-[1px] h-6 bg-white/5"></div>
                <button onclick="mischiefManaged()" class="bg-red-950/20 text-red-500 p-3 rounded-xl hover:bg-red-500 hover:text-white transition"><i data-lucide="log-out" size="20"></i></button>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div id="sidebar" class="w-full md:w-80 flex flex-col gap-6">
            <div class="flex-1 glass-panel rounded-[2.5rem] flex flex-col overflow-hidden border-l border-white/5">
                <div class="p-6 border-b border-white/5 flex items-center justify-between">
                    <span class="heading-font text-[10px] text-amber-100/30 uppercase tracking-widest">Owl Post</span>
                    <i data-lucide="feather" class="w-4 h-4 text-zinc-700"></i>
                </div>
                <div id="chat-stream" class="flex-1 p-6 text-center italic text-zinc-700 text-[10px] uppercase tracking-[0.2em] mt-32">Awaiting owls...</div>
                <div class="p-4"><div class="relative">
                    <input type="text" placeholder="Inscribe message..." class="w-full bg-black/20 border border-white/5 rounded-xl py-3.5 pl-4 pr-12 focus:outline-none focus:border-amber-900/30 text-xs italic">
                    <button class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-amber-900 hover:text-amber-600"><i data-lucide="send-horizonal" size="18"></i></button>
                </div></div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const companionBox = document.getElementById('companion-focus-box');
        const localContainer = document.getElementById('local-video-container');
        let selectedRole = 'Wizard';

        function setRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${role.toLowerCase()}`).classList.add('active');
            document.querySelectorAll('.user-role-label').forEach(el => el.innerText = role);
        }

        function apparate() {
            if(!document.getElementById('platform-key').value) return alert("Enter Key.");
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('portal-interface').style.display = 'flex';
            initCamera();
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = stream;
                document.getElementById('remote-video').srcObject = stream;
            } catch (e) { console.error(e); }
        }

        // --- ARTIFACT SYSTEM ---
        function summon(url, size) {
            const artifact = document.createElement('div');
            artifact.className = 'artifact';
            artifact.style.width = size + 'px';
            artifact.style.height = 'auto';
            artifact.style.top = '100px';
            artifact.style.left = '100px';
            
            const img = document.createElement('img');
            img.src = url;
            artifact.appendChild(img);
            
            // Add Remove Button on Double Click
            artifact.ondblclick = () => artifact.remove();
            
            makeMovable(artifact);
            makeResizable(artifact);
            localContainer.appendChild(artifact);
        }

        function makeMovable(el) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            el.onmousedown = dragMouseDown;
            el.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                const event = e.type === 'touchstart' ? e.touches[0] : e;
                pos3 = event.clientX;
                pos4 = event.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                const event = e.type === 'touchmove' ? e.touches[0] : e;
                pos1 = pos3 - event.clientX;
                pos2 = pos4 - event.clientY;
                pos3 = event.clientX;
                pos4 = event.clientY;
                el.style.top = (el.offsetTop - pos2) + "px";
                el.style.left = (el.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        function makeResizable(el) {
            el.onwheel = (e) => {
                e.preventDefault();
                let width = parseInt(el.style.width);
                if (e.deltaY < 0) width += 10; else width -= 10;
                el.style.width = Math.max(30, width) + 'px';
            };
        }

        function clearArtifacts() {
            document.querySelectorAll('.artifact').forEach(a => a.remove());
        }

        // --- UI LOGIC ---
        function enterFocus() { if (companionBox.requestFullscreen) companionBox.requestFullscreen(); }
        function exitFocus() { if (document.fullscreenElement) document.exitFullscreen(); }
        function toggleImmersive() { companionBox.classList.toggle('immersive-active'); }
        function mischiefManaged() { if(confirm("Close connection?")) location.reload(); }
        
        document.addEventListener('fullscreenchange', () => {
            const isFS = !!document.fullscreenElement;
            document.getElementById('focus-bar').classList.toggle('hidden', !isFS);
            document.getElementById('immersive-toggle').classList.toggle('hidden', !isFS);
            document.getElementById('bottom-nav').classList.toggle('hidden', isFS);
            document.getElementById('sidebar').classList.toggle('hidden', isFS);
        });

        setRole('Wizard');
    </script>
</body>
</html>
