<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>9 ¾ | Way to Hogwarts</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#a3854b;--obsidian:#08070b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Crimson Pro',serif;background:var(--obsidian);color:#d1d5db;height:100vh;overflow:hidden;font-size:1rem;}
.cinzel{font-family:'Cinzel',serif;letter-spacing:.12em;}
.glass{background:rgba(15,15,20,.88);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(163,133,75,.15);}
.tbar{background:rgba(8,8,14,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);}
.split{width:1px;height:65%;background:linear-gradient(to bottom,transparent,rgba(163,133,75,.3),transparent);}
.station-sign{width:100px;height:100px;border:3px solid #fef3c7;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;}
.role-btn{transition:all .2s;color:#71717a;cursor:pointer;}
.role-btn.active{border-color:var(--gold)!important;color:#fff;background:rgba(163,133,75,.15);box-shadow:0 0 14px rgba(163,133,75,.2);}
.vbox{position:relative;border-radius:1.5rem;overflow:hidden;background:#111;border:1px solid rgba(255,255,255,.06);height:100%;}
video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block;}
.artifact{position:absolute;cursor:grab;user-select:none;z-index:100;touch-action:none;}
.artifact:active{cursor:grabbing;}
.artifact img{width:100%;height:auto;pointer-events:none;display:block;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.6));}
.scroll-gold::-webkit-scrollbar{width:3px;}
.scroll-gold::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px;}
#art-menu{display:none;position:absolute;bottom:calc(100%+15px);left:50%;transform:translateX(-50%);width:220px;z-index:400;}
#art-menu.open{display:flex;flex-direction:column;}

/* Pages */
#landing,#dashboard{position:absolute;inset:0;}
#dashboard{display:none;}
#dashboard.active{display:flex;flex-direction:column;}

@media(min-width:768px){
  #dashboard.active{flex-direction:row;}
}

.companion-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;width:100%;background:rgba(10,10,16,0.8);}
</style>
</head>
<body>

<!-- ═══════ LANDING ═══════ -->
<div id="landing" class="flex flex-col md:flex-row items-center justify-center p-6 overflow-hidden">
  <div class="absolute w-[600px] h-[600px] bg-purple-900/5 blur-[150px] rounded-full pointer-events-none"></div>
  <div class="flex-1 flex flex-col items-center md:items-end md:pr-14 text-center md:text-right mb-10 md:mb-0">
    <div class="station-sign mb-7">
      <span class="text-4xl font-bold text-white leading-none">9</span>
      <div class="w-9 h-[2px] bg-white my-1"></div>
      <span class="text-lg font-bold text-white leading-none uppercase">¾</span>
    </div>
    <h1 class="cinzel text-3xl md:text-5xl font-bold text-white mb-2 uppercase">Way to Hogwarts</h1>
    <h2 class="cinzel text-lg md:text-2xl font-light text-amber-600 mb-3 italic">The Wizarding School</h2>
    <p class="text-zinc-600 uppercase tracking-[.3em] text-[10px]">(Muggles strictly prohibited)</p>
  </div>
  <div class="hidden md:block split"></div>
  <div class="flex-1 flex flex-col items-center md:items-start md:pl-14 w-full">
    <div class="glass p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl">
      <h2 class="cinzel text-base mb-7 text-amber-100/70">Platform Entry</h2>
      <div class="space-y-5">
        <div>
          <p class="text-[9px] uppercase tracking-widest text-zinc-600 mb-2.5 ml-1 cinzel">Identity</p>
          <div class="flex gap-2">
            <button id="btn-wizard" class="role-btn active flex-1 py-3.5 border border-white/5 rounded-2xl text-[10px] uppercase tracking-widest font-bold cinzel">Wizard</button>
            <button id="btn-witch" class="role-btn flex-1 py-3.5 border border-white/5 rounded-2xl text-[10px] uppercase tracking-widest font-bold cinzel">Witch</button>
          </div>
        </div>
        <div>
          <p class="text-[9px] uppercase tracking-widest text-zinc-600 mb-2.5 ml-1 cinzel">Wizarding Name</p>
          <input id="user-name" type="text" placeholder="e.g. Albus" class="w-full bg-black/40 border border-amber-900/20 rounded-2xl px-5 py-3.5 focus:outline-none focus:border-amber-700/40 italic text-sm text-white"/>
        </div>
        <div>
          <p class="text-[9px] uppercase tracking-widest text-zinc-600 mb-2.5 ml-1 cinzel">Room Code</p>
          <div class="flex gap-2">
            <input id="room-code-input" type="text" placeholder="Enter or create..." class="flex-1 bg-black/40 border border-amber-900/20 rounded-2xl px-5 py-3.5 focus:outline-none focus:border-amber-700/40 italic text-sm text-white"/>
            <button id="gen-room-btn" class="px-4 py-3.5 glass rounded-2xl text-amber-600 hover:text-amber-400 text-[10px] cinzel uppercase tracking-widest transition">New</button>
          </div>
        </div>
        <button id="apparate-btn" class="w-full bg-zinc-100 text-black font-bold py-4 rounded-2xl hover:bg-white transition active:scale-95 text-[10px] uppercase tracking-[.2em] shadow-xl cinzel">Apparate</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════ DASHBOARD ═══════ -->
<div id="dashboard" class="h-screen p-3 gap-3">
  <div id="main-area" class="flex-1 flex flex-col gap-3 min-w-0">
    <div id="video-grid" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 min-h-0">
      
      <!-- Self View -->
      <div id="local-box" class="vbox">
        <video id="local-video" autoplay muted playsinline class="scale-x-[-1]"></video>
        <div class="absolute bottom-3 left-3 tbar px-3 py-1 rounded-xl text-[9px] uppercase tracking-widest text-amber-200 cinzel" id="local-label">Wizard</div>
      </div>

      <!-- Companion View -->
      <div id="companion-box" class="vbox group">
        <div id="companion-placeholder" class="companion-placeholder">
          <div class="w-16 h-16 rounded-full glass flex items-center justify-center text-3xl">🦉</div>
          <p class="cinzel text-zinc-600 text-[10px] uppercase tracking-widest text-center px-4">Waiting for Owl Post...<br/><span class="text-zinc-700">Share your room code to start</span></p>
        </div>
        <video id="remote-video" autoplay playsinline class="hidden"></video>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div id="bottom-nav" class="glass w-fit mx-auto px-7 py-3.5 rounded-[2rem] flex items-center gap-6 shadow-2xl relative z-[300]">
      <button id="mic-btn" class="text-zinc-500 hover:text-white transition p-1"><i data-lucide="mic"></i></button>
      <button id="cam-btn" class="text-zinc-500 hover:text-white transition p-1"><i data-lucide="video"></i></button>
      
      <!-- Artifacts Menu -->
      <div class="relative" id="art-wrap">
        <button id="art-btn" class="text-zinc-500 hover:text-amber-400 transition p-1"><i data-lucide="sparkles"></i></button>
        <div id="art-menu" class="glass border border-white/10 shadow-2xl rounded-2xl p-2.5 w-52">
          <div class="text-[8px] uppercase tracking-widest text-zinc-600 px-3 py-2 cinzel">Summon Artifact</div>
          <div id="art-list" class="max-h-60 overflow-y-auto scroll-gold flex flex-col gap-0.5"></div>
          <button id="clear-art-btn" class="w-full text-[10px] uppercase tracking-widest p-2.5 hover:bg-red-900/15 rounded-xl text-red-600 mt-1 border-t border-white/5 cinzel">Finite Incantatem</button>
        </div>
      </div>

      <div class="w-px h-5 bg-white/10"></div>
      <button id="leave-btn" class="bg-red-950/20 text-red-500 p-2.5 rounded-xl hover:bg-red-500 hover:text-white transition"><i data-lucide="log-out" size="18"></i></button>
    </div>
  </div>
</div>

<script>
// Initialize Lucide Icons
lucide.createIcons();

let role = 'Wizard';
let myName = '';
let roomCode = '';
let camStream = null;

// --- Role Selection Logic ---
const btnWizard = document.getElementById('btn-wizard');
const btnWitch = document.getElementById('btn-witch');

btnWizard.onclick = () => {
  role = 'Wizard';
  btnWizard.classList.add('active');
  btnWitch.classList.remove('active');
};

btnWitch.onclick = () => {
  role = 'Witch';
  btnWitch.classList.add('active');
  btnWizard.classList.remove('active');
};

// --- Room Generation Logic ---
document.getElementById('gen-room-btn').onclick = () => {
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  document.getElementById('room-code-input').value = code;
};

// --- Apparate (Entry) Logic ---
document.getElementById('apparate-btn').onclick = async () => {
  const nameInput = document.getElementById('user-name').value.trim();
  const roomInput = document.getElementById('room-code-input').value.trim();

  if (!nameInput) {
    alert("Reveal your name, traveler!");
    return;
  }
  
  myName = nameInput;
  roomCode = roomInput || "HOGWARTS";
  
  document.getElementById('local-label').innerText = `${role} ${myName}`;
  document.getElementById('landing').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('local-video').srcObject = camStream;
  } catch (err) {
    alert("Camera failed. Ministry of Magic requires visual identification!");
  }
};

// --- Artifacts System ---
const ARTIFACTS = [
  { name: "Sorting Hat", url: "https://i.ibb.co/60pL5fV/sorting-hat.png", size: 220 },
  { name: "Harry's Glasses", url: "https://i.ibb.co/9H8vSyg/glasses.png", size: 120 },
  { name: "Golden Snitch", url: "https://i.ibb.co/pXQv6mG/snitch.png", size: 80 },
  { name: "Gryffindor Scarf", url: "https://i.ibb.co/yYy8S8P/scarf.png", size: 260 },
  { name: "Luna's Spectres", url: "https://i.ibb.co/mC3xYp1/luna.png", size: 140 },
  { name: "Elder Wand", url: "https://i.ibb.co/mS7xYp1/wand.png", size: 180 }
];

const artList = document.getElementById('art-list');
ARTIFACTS.forEach(art => {
  const btn = document.createElement('button');
  btn.className = "w-full text-left p-3 hover:bg-white/10 rounded-xl cinzel text-[10px] text-white uppercase transition";
  btn.innerText = art.name;
  btn.onclick = () => {
    summonArtifact(art.url, art.size);
    document.getElementById('art-menu').classList.remove('open');
  };
  artList.appendChild(btn);
});

function summonArtifact(url, size) {
  const container = document.getElementById('local-box');
  const el = document.createElement('div');
  el.className = 'artifact';
  el.style.width = size + "px";
  el.style.left = "30%";
  el.style.top = "20%";
  
  const img = document.createElement('img');
  img.src = url;
  
  el.appendChild(img);
  container.appendChild(el);
  makeDraggable(el);
  
  // Double click to remove
  el.ondblclick = () => el.remove();
}

document.getElementById('art-btn').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('art-menu').classList.toggle('open');
};

document.getElementById('clear-art-btn').onclick = () => {
  document.querySelectorAll('.artifact').forEach(a => a.remove());
};

// Close menu on click outside
document.addEventListener('click', () => {
  document.getElementById('art-menu').classList.remove('open');
});

// --- Draggable Logic (Full) ---
function makeDraggable(el) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  
  el.onmousedown = dragStart;
  el.ontouchstart = dragStart;

  function dragStart(e) {
    const event = e.type === 'touchstart' ? e.touches[0] : e;
    pos3 = event.clientX;
    pos4 = event.clientY;
    document.onmouseup = dragEnd;
    document.ontouchend = dragEnd;
    document.onmousemove = dragMove;
    document.ontouchmove = dragMove;
  }

  function dragMove(e) {
    const event = e.type === 'touchmove' ? e.touches[0] : e;
    pos1 = pos3 - event.clientX;
    pos2 = pos4 - event.clientY;
    pos3 = event.clientX;
    pos4 = event.clientY;
    el.style.top = (el.offsetTop - pos2) + "px";
    el.style.left = (el.offsetLeft - pos1) + "px";
  }

  function dragEnd() {
    document.onmouseup = null;
    document.onmousemove = null;
    document.ontouchend = null;
    document.ontouchmove = null;
  }
}

document.getElementById('leave-btn').onclick = () => location.reload();
</script>
</body>
</html>
